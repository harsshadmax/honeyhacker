<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Northwind Corp | Admin Portal</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef1f5;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:#fff;width:360px;padding:36px;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
h1{font-size:20px;margin:0 0 4px;color:#1d3557}p.sub{margin:0 0 22px;color:#6b7785;font-size:13px}
label{display:block;font-size:12px;color:#445;margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid #c8d0da;border-radius:4px;font-size:14px}
button{margin-top:20px;width:100%;padding:11px;background:#1d3557;color:#fff;border:0;border-radius:4px;font-size:14px;cursor:pointer}
.err{background:#fde8e8;color:#a32020;padding:9px;border-radius:4px;font-size:13px;margin-bottom:6px}
.foot{margin-top:18px;font-size:11px;color:#9aa5b1;text-align:center}
</style></head><body>
<form class="card" method="post" action="/login">
<h1>Northwind Corp</h1><p class="sub">Internal Administration Portal &middot; v4.2.1</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<label>Username</label><input name="username" autocomplete="off" autofocus>
<label>Password</label><input name="password" type="password">
<button type="submit">Sign in</button>
<div class="foot">Authorised personnel only. Activity is monitored.</div>
</form></body></html>
